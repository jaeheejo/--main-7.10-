<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat w/ Kyoka - Kokoa Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body id="chat-screen">
    <div class="status-bar">
        <div class="status-bar__column">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar__column">
            <span>18:43</span>
        </div>
        <div class="status-bar__column">
            <span>110%</span>
            <i class="fas fa-battery-full fa-lg"></i>
            <i class="fas fa-bolt"></i>
        </div>
    </div>

    <header class="alt-header">
        <div class="alt-header__column"><a href="javascript:history.back();"><i class="fa-solid fa-angle-left"></i></a>
        </div>
        <div class="alt-header__column">
            <h1 class="alt-header__title kyoka">Kyoka</h1>
        </div>
        <div class="alt-header__column">
            <span><i class="fa-solid fa-magnifying-glass"></i></span>
            <span><i class="fa-solid fa-bars"></i></span>
        </div>
    </header>

    <main class="main-screen main-chat">
        <div class="chat-timestamp">
            Friday, June 27, 2025
        </div>

        <div class="message-row">
            <img
                src="https://imgs.search.brave.com/Wg4vEX9xkiW8JKbEtyLgKaqkU-19sCAw7aMRo81czoM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLm15/ZHJhbWFsaXN0LmNv/bS80WG9na181Yy5q/cGc">
            <div class="message-row__content">
                <span class="message__author">Kyoka</span>
                <div class="message__info">
                    <span class="message__bubble">Hey</span>
                    <span class="message__time">16:21</span>
                </div>
            </div>
        </div>

        <div class="message-row message-row--own">
            <div class="message-row__content">
                <div class="message__info">
                    <span class="message__bubble">Hey</span>
                    <span class="message__time">18:43</span>
                </div>
            </div>
        </div>
        <div class="message-row__my">
            <div class="message-row__content">
                <div class="message__info">
                    <span class="message__time">18:43</span>
                    <span class="message__my-bubble">What's up</span>
                </div>
            </div>
        </div>
    </main>

    <form class="reply">
        <div class="reply__column">
            <i class="fa-regular fa-square-plus fa-2x"></i>
        </div>
        <div class="reply__column">
            <input type="text" placeholder="Write a message...">
            <i class="fa-regular fa-face-smile fa-lg"></i>
            <button>
                <i class="fa-solid fa-arrow-up fa-lg"></i>
            </button>
        </div>
    </form>

    <div id="no-mobile">
        <span>Update</span>
    </div>

    <script src="https://kit.fontawesome.com/248617129c.js" crossorigin="anonymous"></script>
</body>

</html>
