<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chats - Kokoa Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <div class="status-bar">
        <div class="status-bar__column">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar__column">
            <span>18:43</span>
        </div>
        <div class="status-bar__column">
            <span>110%</span>
            <i class="fas fa-battery-full fa-lg"></i>
            <i class="fas fa-bolt"></i>
        </div>
    </div>

    <header class="screen-header">
        <h1 class="screen-header__title">Chats</h1>
        <div class="screen-header__icons">
            <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
            <span><i class="fa-regular fa-comment-dots fa-lg"></i></span>
            <span><i class="fa-solid fa-music fa-lg"></i></span>
            <span><a href="settings.html"><i class="fa-solid fa-gear fa-lg"></i></a></span>
        </div>
    </header>

    <main class="main-screen">
        <a href>
            <div class="user-component">
                <div class="user-component__column">
                    <img src="https://imgs.search.brave.com/-rQRoWc1yvvm4TvCFoTRcCq4iCFBDtJ74Alw3qw5buE/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9sb2dv/cy1kb3dubG9hZC5j/b20vd3AtY29udGVu/dC91cGxvYWRzLzIw/MTYvMDkvS2FrYW9U/YWxrX2xvZ29fS2Fr/YW9fVGFsay03MDB4/NzAwLnBuZw"
                        class="user-component__avatar user-component__avatar" />
                    <div class="user-component__text">
                        <h4 class="user-component__title">KokoaTalk</h4>
                        <h6 class="user-component__subtitle">Please check My Kokoa Account
                        </h6>
                    </div>
                </div>
                <div class="user-component__badge">
                    <span class="user-component__time">18:42</span>
                    <span class="badge">1</span>
                </div>
            </div>
        </a>
        <a href="chat.html">
            <div class="user-component">
                <div class="user-component__column">
                    <img src="https://imgs.search.brave.com/Wg4vEX9xkiW8JKbEtyLgKaqkU-19sCAw7aMRo81czoM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLm15/ZHJhbWFsaXN0LmNv/bS80WG9na181Yy5q/cGc"
                        class="user-component__avatar"/>
                    <div class="user-component__text">
                        <h4 class="user-component__title">Kyoka</h4>
                        <h6 class="user-component__subtitle">Hey
                        </h6>
                    </div>
                </div>
                <div class="user-component__badge">
                    <span class="user-component__time">18:43</span>
                    <span class="badge">1</span>
                </div>
            </div>
        </a>
    </main>

    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__btn"><a class="nav__link" href="friends.html"><i class="fa-regular fa-user fa-2x"></i></a>
            </li>
            <li class="nav__btn">
                <a class="nav__link" href="chats2.html">
                    <span class="nav__notification">2</span>
                    <i class="fa-solid fa-comment fa-2x"></i>
                </a>
            </li>
            <li class="nav__btn"><a class="nav__link" href="find.html"><i
                        class="fa-solid fa-magnifying-glass fa-2x"></i></a>
            </li>
            <li class="nav__btn"><a class="nav__link" href="more.html"><i class="fa-solid fa-ellipsis fa-2x"></i><span
                        class="screen-header__notification"></span></a></li>
        </ul>
    </nav>

    <script src="https://kit.fontawesome.com/248617129c.js" crossorigin="anonymous"></script>
</body>

</html>
<script src="https://kit.fontawesome.com/248617129c.js" crossorigin="anonymous"></script>
</body>

</html>
